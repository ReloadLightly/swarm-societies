  <g id="text_25">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6f6a78" x="21.226484" y="357.048" transform="rotate(-0 21.226484 357.048)">Partner snapshots may change between generations. Color identifies the target society. Fresh-case outcomes are separate.</text>
