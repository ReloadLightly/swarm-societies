   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6f6a78" x="21.226484" y="45.830437" transform="rotate(-0 21.226484 45.830437)">Search fitness only · candidate evaluations are not independent evolutionary runs</text>
