  </g>
  <g id="text_26">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6f6a78" x="12.96" y="43.114359" transform="rotate(-0 12.96 43.114359)">24 independent arenas · each arena contributes one mean across its interacting societies</text>
  </g>
  <g id="text_27">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6f6a78" x="12.96" y="321.408" transform="rotate(-0 12.96 321.408)">Negative differences favor that condition. Time-average CRPS is the trapezoidal area divided by the observed tick span.</text>
  </g>
  <g id="text_28">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6f6a78" x="12.96" y="345.6" transform="rotate(-0 12.96 345.6)">All arms use the same fixed numerical learner. Pooled evidence receives more observations; sharing rules are not learned.</text>
  </g>
  <g id="text_29">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6f6a78" x="12.96" y="369.792" transform="rotate(-0 12.96 369.792)">This control estimates parameters in supplied mechanisms. It does not test structure discovery, active experiments or evolved learning.</text>
  </g>
