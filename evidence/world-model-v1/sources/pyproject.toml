[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-societies"
version = "0.1.0"
description = "Multilevel coevolution of executable member policies and institutions"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "Pillow>=9", "psutil>=5.9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["swarm_societies*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
